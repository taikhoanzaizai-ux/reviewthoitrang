name: Bootstrap Auto Review Source

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and expand source bundle
        run: |
          cat source_bundle.part00 source_bundle.part01 source_bundle.part02 source_bundle.part03 > source_bundle.tar.gz
          tar -xzf source_bundle.tar.gz
          rm -f source_bundle.tar.gz
          rm -f source_bundle.part00 source_bundle.part01 source_bundle.part02 source_bundle.part03
          rm -f .github/workflows/bootstrap.yml
      - name: Commit expanded source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Auto Review Video V4.9.3 source and CI" || exit 0
          git push
