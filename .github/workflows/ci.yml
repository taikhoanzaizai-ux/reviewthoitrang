name: Auto Review CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  core-windows:
    name: Core / Windows / Python 3.12
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install core dependencies
        run: python -m pip install -r requirements.txt
      - name: Python syntax check
        run: python -m py_compile app.py launcher.py video_worker.py voice_worker.py voice_daemon.py tests/smoke_test.py
      - name: Core smoke test
        run: python tests/smoke_test.py

  frontend-js:
    name: Frontend JavaScript syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Extract inline JavaScript
        shell: python
        run: |
          from pathlib import Path
          import re
          html = Path('static/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
          Path('frontend-check.js').write_text('\n'.join(scripts), encoding='utf-8')
      - name: JavaScript syntax check
        run: |
          node --check frontend-check.js
          node --check static/patch_v495.js
          node --check static/patch_v496.js

  voice-env:
    name: VieNeu / Python 3.11 dependency check
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install VieNeu environment
        run: python -m pip install -r local-voice/requirements.txt
      - name: Import VieNeu and ONNX Runtime
        run: python -c "import onnxruntime, vieneu; print('onnxruntime', onnxruntime.__version__); print('vieneu import OK')"
